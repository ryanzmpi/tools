<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marathon Tools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Jost:ital,wght@0,400;0,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Brand palette: Endurance Run Blue #22475A, Finish Line Orange #ED6441 */
  :root {
    --blue: #22475A; --orange: #ED6441;
    --bg: #f3f5f6; --card: #ffffff; --text: #22475A; --muted: #5d7480;
    --line: #dbe2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1d25; --card: #17303d; --text: #eef3f5; --muted: #9fb3bd;
      --line: #264757;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 500 16px/1.45 "Jost", "Futura PT", Futura, system-ui, sans-serif;
  }
  .topbar { background: var(--blue); border-bottom: 4px solid var(--orange); }
  .topbar .inner {
    max-width: 1040px; margin: 0 auto; padding: 22px 16px;
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; color: #fff; text-decoration: none; }
  .brand img { height: 44px; width: auto; display: block; }
  .brand .title {
    font: 600 22px/1 "Oswald", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .04em;
    padding-left: 18px; border-left: 2px solid rgba(255,255,255,.35);
  }
  input[type=search] {
    width: 260px; max-width: 100%; padding: 10px 14px; font: inherit;
    border: 0; border-radius: 4px; background: #fff; color: #22475A;
  }
  input[type=search]::placeholder { color: #7d929c; }
  input[type=search]:focus { outline: 3px solid var(--orange); outline-offset: 1px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  section { margin-bottom: 36px; }
  h2 {
    display: inline-block; margin: 0 0 16px; padding: 6px 22px 6px 16px;
    background: var(--orange); color: #fff;
    font: 600 20px/1.2 "Oswald", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em;
    box-shadow: 4px 4px 0 rgba(0,0,0,.18);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  a.tile {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 4px; padding: 14px 16px;
    transition: border-color .12s, transform .12s, box-shadow .12s;
  }
  @media (prefers-color-scheme: dark) { a.tile { border-left-color: #5f8ea5; } }
  a.tile:hover, a.tile:focus-visible {
    border-color: var(--orange); border-left-color: var(--orange);
    transform: translateY(-1px); box-shadow: 0 4px 14px rgba(34,71,90,.12); outline: none;
  }
  .name { font: italic 600 18px/1.25 "Jost", "Futura PT", Futura, sans-serif; display: flex; align-items: baseline; gap: 8px; }
  .name::after { content: "↗"; color: var(--orange); font-style: normal; margin-left: auto; }
  .desc { color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 4px; }
  .tag { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--orange); color: #fff; }
  .empty { color: var(--muted); display: none; }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
  @media (max-width: 520px) {
    .brand img { height: 34px; }
    .brand .title { font-size: 18px; padding-left: 14px; }
    input[type=search] { width: 100%; }
  }
</style>
</head>

<script>
/* ============================================================
   EDIT YOUR LINKS HERE
   - name:  button text
   - url:   full link
   - group: section heading (pages with the same group sit together)
   - desc:  optional one-line description
   - tag:   optional small label, e.g. "New"
   Groups appear in the order they first show up in this list.
   ============================================================ */
const TOOLS = [
  { name: "Apparel Designer",      url: "https://ryanzmpi.github.io/apparel-previewer/",            group: "Customer Service", desc: "Mock up a garment with artwork and get a blank-price estimate" },
  { name: "Shipwatch",             url: "https://web-production-4de1b.up.railway.app",             group: "Customer Service", desc: "Shipping exceptions and delays" },
  { name: "Help Scout",            url: "https://secure.helpscout.net",                             group: "Customer Service", desc: "Customer support inbox" },
  { name: "Orders Dashboard",      url: "https://marathon-shop-dashboard-production.up.railway.app", group: "Production", desc: "Printer's Plan and Atlas orders combined: workload, jobs by stage, press capacity, revenue and goals" },
  { name: "Atlas Dashboard",       url: "https://gomake-dashboard-production.up.railway.app",       group: "Production", desc: "Atlas orders only: production stages; created, due and shipped counts" },
  { name: "ShipStation",           url: "https://ship9.shipstation.com/orders/awaiting-shipment",   group: "Production", desc: "Orders awaiting shipment" },
  { name: "Press Statistics",      url: "https://claude.ai/artifact/9X4GA3G7E7BzVP9HKzgJjL",        group: "Managers", desc: "Press status and utilization" },
  { name: "Shipping Charge Check", url: "https://web-production-0965c.up.railway.app",             group: "Managers", desc: "Check shipping charges on orders" },
  { name: "Time Clock",            url: "https://www.payrollservers.us/sc/login.asp",               group: "Managers", desc: "Payroll time clock login" },
];

const groupsEl = document.getElementById("groups");
const emptyEl = document.getElementById("empty");

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  const shown = TOOLS.filter(t =>
    !f || [t.name, t.desc, t.group, t.tag].some(v => (v || "").toLowerCase().includes(f)));
  const order = [];
  const byGroup = {};
  for (const t of shown) {
    const g = t.group || "Other";
    if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
    byGroup[g].push(t);
  }
  groupsEl.innerHTML = "";
  for (const g of order) {
    const sec = document.createElement("section");
    const h = document.createElement("h2"); h.textContent = g; sec.appendChild(h);
    const grid = document.createElement("div"); grid.className = "grid";
    for (const t of byGroup[g]) {
      const a = document.createElement("a");
      a.className = "tile"; a.href = t.url; a.target = "_blank"; a.rel = "noopener";
      const n = document.createElement("div"); n.className = "name"; n.textContent = t.name; a.appendChild(n);
      if (t.desc) { const d = document.createElement("div"); d.className = "desc"; d.textContent = t.desc; a.appendChild(d); }
      if (t.tag)  { const s = document.createElement("span"); s.className = "tag"; s.textContent = t.tag; a.appendChild(s); }
      grid.appendChild(a);
    }
    sec.appendChild(grid);
    groupsEl.appendChild(sec);
  }
  emptyEl.style.display = shown.length ? "none" : "block";
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = groupsEl.querySelector("a.tile"); if (first) first.click(); }
});
render();
</script>
</body>
</html>
