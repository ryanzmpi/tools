<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marathon Tools</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e3df; --accent: #c8102e; --accent-soft: #fbe9ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ecebe7; --muted: #9a9993;
      --line: #33332f; --accent: #ff5a6e; --accent-soft: #3a1f23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  input[type=search] {
    width: 260px; max-width: 100%; padding: 10px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text);
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  section { margin-bottom: 28px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  a.tile {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    transition: border-color .12s, transform .12s;
  }
  a.tile:hover, a.tile:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .name::after { content: "↗"; color: var(--muted); font-weight: 400; margin-left: auto; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tag { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .empty { color: var(--muted); display: none; }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>Marathon</span> Tools</h1>
      <p class="sub">All of our internal pages in one place.</p>
    </div>
    <input type="search" id="q" placeholder="Search tools…" aria-label="Search tools" autofocus>
  </header>
  <main id="groups"></main>
  <p class="empty" id="empty">No tools match that search.</p>
  <footer>Need a link added or changed? Tell Ryan.</footer>
</div>

<script>
/* ============================================================
   EDIT YOUR LINKS HERE
   - name:  button text
   - url:   full link
   - group: section heading (pages with the same group sit together)
   - desc:  optional one-line description
   - tag:   optional small label, e.g. "Manager"
   Groups appear in the order they first show up in this list.
   ============================================================ */
const TOOLS = [
  { name: "Printer's Plan Dashboard", url: "https://marathon-shop-dashboard-production.up.railway.app", group: "Production", desc: "Workload, jobs by stage, press capacity, revenue and goals" },
  { name: "Atlas Dashboard",       url: "https://gomake-dashboard-production.up.railway.app",       group: "Production", desc: "Orders by production stage; created, due and shipped counts" },
  { name: "Apparel Designer",      url: "https://ryanzmpi.github.io/apparel-previewer/",            group: "Customer Service", desc: "Mock up a garment with artwork and get a blank-price estimate" },
  { name: "Shipwatch",             url: "https://web-production-4de1b.up.railway.app",             group: "Customer Service", desc: "Shipping exceptions and delays" },
  { name: "Press Statistics",      url: "https://claude.ai/artifact/9X4GA3G7E7BzVP9HKzgJjL",        group: "Managers", desc: "Press status and utilization" },
  { name: "Shipping Charge Check", url: "https://web-production-0965c.up.railway.app",             group: "Managers", desc: "Check shipping charges on orders" },
];

const groupsEl = document.getElementById("groups");
const emptyEl = document.getElementById("empty");

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  const shown = TOOLS.filter(t =>
    !f || [t.name, t.desc, t.group, t.tag].some(v => (v || "").toLowerCase().includes(f)));
  const order = [];
  const byGroup = {};
  for (const t of shown) {
    const g = t.group || "Other";
    if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
    byGroup[g].push(t);
  }
  groupsEl.innerHTML = "";
  for (const g of order) {
    const sec = document.createElement("section");
    const h = document.createElement("h2"); h.textContent = g; sec.appendChild(h);
    const grid = document.createElement("div"); grid.className = "grid";
    for (const t of byGroup[g]) {
      const a = document.createElement("a");
      a.className = "tile"; a.href = t.url; a.target = "_blank"; a.rel = "noopener";
      const n = document.createElement("div"); n.className = "name"; n.textContent = t.name; a.appendChild(n);
      if (t.desc) { const d = document.createElement("div"); d.className = "desc"; d.textContent = t.desc; a.appendChild(d); }
      if (t.tag)  { const s = document.createElement("span"); s.className = "tag"; s.textContent = t.tag; a.appendChild(s); }
      grid.appendChild(a);
    }
    sec.appendChild(grid);
    groupsEl.appendChild(sec);
  }
  emptyEl.style.display = shown.length ? "none" : "block";
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = groupsEl.querySelector("a.tile"); if (first) first.click(); }
});
render();
</script>
</body>
</html>
